# Azure DevOps pipeline: build Vite + React (bee-web) và deploy lên Azure App Service
# Branch: master | App Service: devopsgroup1frontend
# Service connection: AzureConnection-DevOpsGroup1-frontend
#
# Trước khi chạy: trong Project Settings → Service connections, tạo/kết nối
# "AzureConnection-DevOpsGroup1-frontend" với quyền deploy tới resource group chứa app.

trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'

steps:
  - checkout: self
    displayName: Checkout bee-web

  - task: NodeTool@0
    displayName: Use Node.js $(nodeVersion)
    inputs:
      versionSpec: $(nodeVersion)

  - script: npm ci
    displayName: npm ci

  - script: npm run build
    displayName: npm run build

  - task: ArchiveFiles@2
    displayName: Zip thư mục dist
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
      replaceExistingArchive: true

  - task: AzureWebApp@1
    displayName: Deploy lên Azure App Service
    inputs:
      azureSubscription: 'AzureConnection-DevOpsGroup1-frontend'
      appType: webAppLinux
      appName: 'devopsgroup1frontend'
      package: '$(Build.ArtifactStagingDirectory)/app.zip'
      runtimeStack: 'NODE|20-lts'
      # SPA tĩnh: zip vào wwwroot, serve lắng nghe $PORT (App Service Linux)
      startUpCommand: 'npx --yes serve@14 -s /home/site/wwwroot -l $PORT'
