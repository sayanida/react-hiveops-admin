# Azure DevOps pipeline: build Vite + React (bee-web) and deploy to Azure App Service
# Branch: master | App Service: devopsgroup1frontend
# Service connection: AzureConnection-DevOpsGroup1-frontend
#
# Before running: in Project Settings -> Service connections, create/connect
# "AzureConnection-DevOpsGroup1-frontend" with deploy permission to the app's resource group.

trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'

steps:
  - checkout: self
    displayName: Checkout bee-web

  - task: UseNode@1
    displayName: Use Node.js $(nodeVersion)
    inputs:
      version: $(nodeVersion)

  - script: npm ci
    displayName: npm ci

  - script: npm run build
    displayName: npm run build

  - task: ArchiveFiles@2
    displayName: Zip dist folder
    inputs:
      rootFolderOrFile: '$(System.DefaultWorkingDirectory)/dist'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
      replaceExistingArchive: true

  - task: AzureWebApp@1
    displayName: Deploy to Azure App Service
    inputs:
      azureSubscription: 'AzureConnection-DevOpsGroup1-frontend'
      appType: webAppLinux
      appName: 'devopsgroup1frontend'
      package: '$(Build.ArtifactStagingDirectory)/app.zip'
      runtimeStack: 'NODE|20-lts'
      # Static SPA: zip into wwwroot, serve listening on $PORT (App Service Linux)
      startUpCommand: 'npx --yes serve@14 -s /home/site/wwwroot -l $PORT'
